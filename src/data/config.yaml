# ============================================================================
# civicDNA — app configuration. No code changes needed; edit, rebuild, deploy.
#
# RANGE-BASED: the `badges:` list at the bottom is keyed by inclusive score
# bands (min..max). Name, icon, colour, taglines and the explanatory text can
# all differ per band. Any band may override the global copy templates.
#
# IMPORTANT (change request §5, §14): the index is NOT a left/right political
# identity. It describes a pattern of civic positions across issues. Band copy
# must not use Democrat / Republican / liberal / conservative / left / right as
# labels for the score. The results spectrum below is separate from all of this:
# it labels the shared individual/collective axis that the topic anchors
# already describe, and it is a derived read-out, not the underlying model.
#
# TEMPLATE PLACEHOLDERS usable in every `explanation` / `shareText` string:
#   {score}       composite index, e.g. 66
#   {suffix}      score.suffix, e.g. "/100"
#   {scoreLabel}  score.label, e.g. "civicDNA Index"
#   {badge}       band name, e.g. "The Measured Believer"
#   {tagline}     band tagline
#   {decisive}    decisiveness %, e.g. 66
#   {decisiveLabel} decisiveness.label, e.g. "decisive"
#   {avgDistance} avg points off neutral that {decisive} corresponds to
#   {answered}    issues the user actually answered
#   {total}       issues offered
#   {zip}         the user's ZIP
#   {brand}       brand.name
#   {url}         brand.shareUrl
#   {spectrumHeadline} dominant spectrum band, or "Evenly split"
#   {tilt}        signed net tilt, -100..+100
#   {tiltText}    same, pre-worded
#   {spectrum}    all five band percentages, e.g. "8% individual, 22% ..."
# ============================================================================
schemaVersion: 2

brand:
  name: "civicDNA"
  # Rendered across the top of the shareable PNG.
  wordmark: "C I V I C D N A"
  shareUrl: "https://evolvedhow.github.io/civicdna/"
  # Call-to-action along the bottom of the shareable PNG.
  badgeCta: "Find your civicDNA"
  # Small label above the badge name on the results card.
  badgeEyebrow: "Fingerprint badge"

score:
  label: "civicDNA Index"
  suffix: "/100"
  # The stance scale. neutral MUST be the exact midpoint of min..max or the
  # decisiveness metric becomes asymmetric (a hard-left and a hard-right
  # answer would score differently).
  min: 0
  max: 100
  neutral: 50

decisiveness:
  label: "decisive"
  # One-line caption under the ring on the shareable PNG.
  caption: "{decisive}% {decisiveLabel}"
  # Shown on the badge card, under the score. Explains the number in plain
  # language. Individual bands may override this.
  explanation: >-
    Decisiveness measures distance, not direction. Across the issues you
    answered, your slider sat an average of {avgDistance} points from the
    neutral midpoint — that's {decisive}% of the furthest you could have gone.
    Leaving every slider on neutral would be 0%; pinning every one to an
    extreme would be 100%. It says nothing about which end you picked — two
    people at opposite ends of the same issue score identically — so how a
    question happens to be worded can't inflate it.

share:
  # Default share text. Bands may override with their own `shareText`.
  # The spectrum leads: it is the read-out people can check, and the only one
  # that says how the answers were distributed rather than where they averaged.
  text: |-
    {brand} — {spectrumHeadline}, {tiltText}.
    {spectrum} across {answered} of {total} issues.
    "{tagline}" · {url}

# ---------------------------------------------------------------------------
# The results spectrum.
#
# A single "60/100, 44% decisive" pair is hard to interpret and easy to argue
# with, so the headline result is a five-band distribution: the share of your
# weighted answers sitting at each point on the axis. Same maths as the
# composite, read as a shape instead of a coordinate.
#
# The labels below name the axis every topic's anchors already share — from
# individual/market discretion at 0, through the neutral midpoint, to
# collective/regulated coordination at 100. They are presentation only:
#   * change request §14 forbids them as the primary response choices, so the
#     question sliders keep using each topic's own fluid anchor labels;
#   * they are not party labels, and the score is still not a left/right
#     identity — a high collective share means you favour coordinated
#     institutions on the issues asked, nothing more.
# ---------------------------------------------------------------------------
spectrum:
  lowLabel: "Individual"
  lowLeanLabel: "Leaning individual"
  neutralLabel: "Moderate"
  highLeanLabel: "Leaning collective"
  highLabel: "Collective"

  # Width of the centre band, in points either side of score.neutral.
  neutralBand: 5
  # Past this distance from neutral a stance counts as a full pole rather than
  # a lean. 20 leaves two 15-point lean bands and two 30-point pole bands,
  # which reads as a spectrum without making "moderate" the default answer.
  strongThreshold: 20

  # If the two sides differ by no more than this many percentage points, the
  # result is reported as evenly split rather than leaning anywhere.
  evenThreshold: 10

# ---------------------------------------------------------------------------
# Per-issue importance rating.
#
# Every question can be rated 0..`max` on "how important is this to you?",
# defaulting to `default`. It multiplies that question's weight:
#
#   effectiveWeight = topicWeight x (rating / default)
#
# so the rating is a 0..5 range over the weight, not over the score:
#
#   0 -> 0.00x  the question is dropped from the score entirely
#   1 -> 0.33x
#   2 -> 0.67x
#   3 -> 1.00x  the default, and a NO-OP
#   4 -> 1.33x
#   5 -> 1.67x
#
# The default is the denominator on purpose: a respondent who rates nothing
# gets exactly the weight — and therefore exactly the score — they got before
# this existed, so no historical composite silently moves. Anything that
# changes the default changes everyone's meaning of the number, so treat it as
# a scoring change and re-test.
# ---------------------------------------------------------------------------
importance:
  enabled: true
  # Pre-selected rating. MUST be > 0 (it is the multiplier's denominator) and
  # MUST be a no-op rating, or every existing score shifts.
  default: 3
  # Highest rating offered. A 0..5 control is the point: five taps, no slider.
  max: 5

  # Copy for the control and its two ends.
  prompt: "How important is this to you?"
  lowLabel: "Not at all"
  highLabel: "Essential"
  # Shown next to the weight block once a question is rated 0.
  excludedNote: >-
    Rated 0, so this question is left out of your score. Your position is
    still saved — raise the rating to count it.

# How the composite index is assembled.
#
# TWO-STAGE, CATEGORY-WEIGHTED:
#   1. Within a category, topics are averaged using their own `weight` from
#      topics.json, scaled by the respondent's importance rating.
#   2. Category scores are then averaged using the weights below.
#
# Stage 2 is the point: without it, a lopsided question bank skews the score.
# If 12 of 25 topics are `social`, a flat average makes the index mostly a
# social-issues score. Category weights decouple "how much this theme counts"
# from "how many questions we happened to write about it".
#
# Categories with no answered topics drop out and the rest re-normalise, so a
# partial run is still scored on the same scale.
scoring:
  categoryWeights:
    market: 1
    welfare: 1
    social: 1
    environment: 1
    technology: 1
    global: 1
    governance: 1

# ---------------------------------------------------------------------------
# Score bands. Inclusive min..max, and they should tile the full score range
# without gaps. Required: id, min, max, name, icon, color, tagline, description.
# Optional per band: explanation, shareText (override the templates above).
# Available icons: beacon, compass, lattice, weave, orbit, scale, fingerprint
# ---------------------------------------------------------------------------
badges:
  - id: lone-beacon
    min: 0
    max: 20
    name: "The Lone Beacon"
    icon: beacon
    color: "#0f766e"
    tagline: "Standing apart from the mainstream field."
    description: "Across these issues you consistently favour individual and market discretion over collective coordination. That is a pattern of policy instincts, not a party label."

  - id: quiet-dissident
    min: 21
    max: 34
    name: "The Quiet Dissident"
    icon: compass
    color: "#7c3aed"
    tagline: "A clear direction, quietly held."
    description: "Consistently off-centre, you hold a defined point of view without broadcasting it. Your answers cluster near one end of most spectra, with enough variation to resist easy categorisation."

  - id: pragmatic-skeptic
    min: 35
    max: 44
    name: "The Pragmatic Skeptic"
    icon: lattice
    color: "#0891b2"
    tagline: "Mostly aligned, but watchful."
    description: "You lean toward individual discretion on balance, but not reflexively. Several issues pull you the other way, which keeps your overall pattern mixed."

  - id: centered-pragmatist
    min: 45
    max: 54
    name: "The Centered Pragmatist"
    icon: weave
    color: "#4f46e5"
    tagline: "You track where the country actually sits."
    description: "Your composite sits near the midpoint. Read this alongside your decisiveness: it can mean measured moderation across the board, or strong positions in opposing directions that cancel out."
    # A centred score can mean two very different things, so this band spells
    # the ambiguity out rather than letting the number imply moderation.
    explanation: >-
      A centred index like {score} is ambiguous on its own, which is why
      decisiveness sits beside it. At {decisive}% you averaged {avgDistance}
      points off neutral. A low figure means you genuinely sat near the middle
      on most issues; a high one means you took strong positions in opposite
      directions that cancelled out in the composite.

  - id: measured-believer
    min: 55
    max: 64
    name: "The Measured Believer"
    icon: orbit
    color: "#4338ca"
    tagline: "Convinced, but not absolutist."
    description: "You lean clearly toward collective and coordinated solutions, while keeping internal checks. You favour shared institutions on most issues without applying the principle uniformly."

  - id: systemic-architect
    min: 65
    max: 79
    name: "The Systemic Architect"
    icon: scale
    color: "#5b21b6"
    tagline: "You see the system, and want to rebuild it."
    description: "You consistently choose stronger shared institutions over market defaults, across categories rather than on a single theme, and you are comfortable saying so."

  - id: broad-reformer
    min: 80
    max: 100
    name: "The Broad-Spectrum Reformer"
    icon: fingerprint
    color: "#6d28d9"
    tagline: "Few half-measures; your fingerprint is unmistakable."
    description: "The most consistent pattern in the set. Across nearly every category you sit far toward coordinated, collective and regulated outcomes."
